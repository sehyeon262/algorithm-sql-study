name: Discord solution notifications

on:
  push:
    branches: [main]
    paths:
      - 'sehyeon-kim/Algorithm/**'
      - 'sehyeon-kim/SQL/**'
      - 'geonbin-lim/Algorithm/**'
      - 'geonbin-lim/SQL/**'
      - 'hyunwoo-jung/Algorithm/**'
      - 'hyunwoo-jung/SQL/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not webhook_url:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is missing")

          def send(content):
              body = json.dumps(
                  {"content": content, "allowed_mentions": {"parse": []}},
                  ensure_ascii=False,
              ).encode("utf-8")
              request = Request(
                  webhook_url,
                  data=body,
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "User-Agent": "DiscordBot (https://example.org, 1.0)",
                  },
                  method="POST",
              )
              with urlopen(request, timeout=20):
                  pass

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              send("🧪 GitHub 풀이 알림 연결 테스트")
              print("Test notification sent")
              raise SystemExit

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          repository = os.environ["GITHUB_REPOSITORY"]
          members = {"sehyeon-kim", "geonbin-lim", "hyunwoo-jung"}
          sent = 0

          for commit in event.get("commits", []):
              title = commit["message"].splitlines()[0]
              if not title.startswith("solve: "):
                  continue

              sha = commit["id"]
              request = Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "User-Agent": "StudyDiscordNotifier/1.0",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  details = json.load(response)

              subjects = set()
              for changed_file in details.get("files", []):
                  if changed_file.get("status") == "removed":
                      continue
                  parts = changed_file["filename"].split("/")
                  if (
                      len(parts) >= 5
                      and parts[0] in members
                      and parts[1] in {"Algorithm", "SQL"}
                      and parts[-1] != ".gitkeep"
                  ):
                      subjects.add(parts[1])
              if not subjects:
                  continue

              match = re.match(
                  r"^solve: \d{6}_(?:algorithm|sql)_([^_]+)_([^_]+)_(.+)$",
                  title,
              )
              problem = (
                  f"{match.group(1).upper()} {match.group(2)} "
                  f"{match.group(3).replace('_', ' ')}"
                  if match
                  else title.removeprefix("solve: ")
              )[:150]
              kind = "·".join(
                  label for key, label in (("Algorithm", "알고리즘"), ("SQL", "SQL"))
                  if key in subjects
              )
              author = (
                  (details.get("author") or {}).get("login")
                  or details["commit"]["author"]["name"]
              )
              send(
                  f"✅ **{kind} 풀이 제출**\n"
                  f"작성자: {author}\n"
                  f"문제: {problem}\n"
                  f"https://github.com/{repository}/commit/{sha}"
              )
              sent += 1

          print(f"Sent {sent} solution notification(s)")
          PY
